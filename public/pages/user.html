<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja — Agro Sistema</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="user-body">

  <header class="user-header">
    <div class="user-header-left">
      <span class="user-logo">🌾 Agro Sistema</span>
    </div>
    <div class="user-header-right">
      <span class="user-greeting">Olá, <strong id="nomeUsuario">Usuário</strong></span>
      <button id="btnLogout" class="btn-logout">Sair</button>
    </div>
  </header>

  <section class="user-hero">
    <h1>Produtos Agrícolas</h1>
    <p>Encontre tudo que você precisa para o campo</p>
    <div class="busca-container">
      <input type="text" id="buscaInput" placeholder="🔍  Buscar produto..." class="busca-input" />
    </div>
  </section>

  <section class="filtros-section">
    <div id="filtrosCategorias" class="filtros-categorias">
      <button class="filtro-btn ativo" onclick="filtrarCategoria('Todos')">Todos</button>
    </div>
  </section>

  <main class="user-main">
    <div id="produtosGrid" class="produtos-grid">
      <p class="sem-produtos">Carregando produtos...</p>
    </div>
  </main>

  <script src="/js/user.js"></script>
</body>
</html>
